{% extends "base.html" %}
{% block title %}Oral exam{% endblock %}
{% block body %}
<div class="card">
  <h1>Verified, {{ name }}</h1>
  <p class="sub">Your identity photo is saved. The oral exam starts here.</p>
  <!-- Plug your AI examiner UI into this page. -->
  <form method="post" action="{{ url_for('finish_exam') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="row"><button type="submit">End exam and view report</button></div>
  </form>
</div>
{% endblock %}
