<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Oral Exam{% endblock %}</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#667085;
            --line:#d9dde5; --accent:#2f5bea; --bad:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:560px; margin:6vh auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
    h1 { margin:0 0 4px; font-size:1.4rem; }
    p.sub { margin:0 0 20px; color:var(--muted); }
    label { display:block; margin:14px 0 4px; font-weight:600; font-size:.9rem; }
    input[type=text], input[type=password] {
      width:100%; padding:10px 12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; }
    button { padding:10px 18px; font-size:1rem; border:0; border-radius:8px;
             background:var(--accent); color:#fff; cursor:pointer; }
    button.secondary { background:#e8ebf2; color:var(--ink); }
    button:disabled { opacity:.5; cursor:default; }
    .row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .error { color:var(--bad); margin-top:12px; }
    video, canvas, img.photo { width:100%; border-radius:10px; background:#000; display:block; }
    p.step { margin:0 0 6px; color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; }
    .photos { display:flex; gap:12px; margin-top:8px; }
    .photos figure { flex:1; margin:0; }
    .photos figcaption { margin-top:4px; color:var(--muted); font-size:.85rem; text-align:center; }
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    td { padding:8px 0; border-top:1px solid var(--line); vertical-align:top; }
    td:first-child { color:var(--muted); width:38%; }
    @media print { body { background:#fff; } .no-print { display:none; } .card { border:0; } }
  </style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
